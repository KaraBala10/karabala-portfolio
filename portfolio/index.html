    <!-- Theme + JS-gating before first paint. Also a safety net: if hydration
         never completes, drop the `js` class so reveal-gated content shows. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          var s = localStorage.getItem("theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          d.setAttribute("data-theme", s === "light" || s === "dark" ? s : light ? "light" : "dark");
        } catch (e) {
          d.setAttribute("data-theme", "dark");
        }
        setTimeout(function () {
          if (d.dataset.hydrated !== "1") d.classList.remove("js");
        }, 4000);
      })();
    </script>
